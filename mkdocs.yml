site_name: Ariad
site_description: The thread through the labyrinth of agentic software work.
repo_url: https://github.com/alissonvale/ariad
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.action.edit
    - content.code.copy
nav:
  - Home: index.md
  - Method:
      - method/index.md
      - Overview: method/overview.md
      - Work Areas: method/work-areas.md
      - Expand and Collapse: method/expand-collapse.md
      - Driver and Navigator: method/driver-navigator.md
      - Process, Project, Product: method/triad.md
      - Contracts and Preferences: method/contracts-and-preferences.md
      - Explicit Policies: method/explicit-policies.md
      - Methodological Roots: method/methodological-roots.md
  - Exploration:
      - exploration/index.md
      - Conceptual Model: exploration/conceptual-model.md
      - Exploratory Flow: exploration/flow.md
      - Visual Grammar: exploration/visual-grammar.md
  - Delivery:
      - delivery/index.md
      - Roadmap Taxonomy: delivery/roadmap-taxonomy.md
      - Conceptual Model: delivery/conceptual-model.md
      - Delivery Flow: delivery/flow.md
      - Visual Grammar: delivery/visual-grammar.md
      - Cadences: delivery/cadences.md
      - Release Management: delivery/release-management.md
      - User and Technical Story Lifecycle: delivery/story-lifecycle.md
      - Checkpoints: delivery/checkpoints.md
  - Refinement:
      - refinement/index.md
      - Conceptual Model: refinement/conceptual-model.md
      - Refinement Flow: refinement/flow.md
  - Project Templates:
      - project-templates/index.md
      - AGENTS.md: project-templates/AGENTS.md
      - Project Briefing: project-templates/docs/project/briefing.md
      - Decisions: project-templates/docs/project/decisions/index.md
      - Roadmap: project-templates/docs/project/roadmap/index.md
      - Technical Debt Ledger: project-templates/docs/project/debt/index.md
      - Local Development Guide: project-templates/docs/process/development-guide.md
      - Worklog: project-templates/docs/process/worklog/index.md
      - Product Principles: project-templates/docs/product/principles.md
  - Adoption:
      - adoption/index.md
      - Install in a Project: adoption/install-in-a-project.md
      - Agent-Assisted Initialization: adoption/agent-assisted-initialization.md
      - Builder Mode Guide: adoption/builder-mode-guide.md
      - First Adoption Session: adoption/first-adoption-session.md
  - Extension (Maestro):
      - extension/index.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
